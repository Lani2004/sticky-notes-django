{% extends 'notes/base.html' %}

{% block title %}Create Note{% endblock %}

{% block content %}

<h2>Create a Sticky Note</h2>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save Note</button>
</form>

<a href="{% url 'note_list' %}">Cancel</a>

{% endblock %}
